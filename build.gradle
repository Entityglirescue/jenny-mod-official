plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.+'
}

version = '1.0.0'
group = 'com.jennymod'
archivesBaseName = 'jenny_mod_official'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.21.1'
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.21.1-52.0.1'
}
